name: SpanishHoy Bot

on:
  schedule:
    # 4 runs per day (~5 hours apart) — UTC times
    - cron: "0 3 * * *"    # 03:00 UTC
    - cron: "0 8 * * *"    # 08:00 UTC
    - cron: "0 13 * * *"   # 13:00 UTC
    - cron: "0 18 * * *"   # 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run bot
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python bot.py

      # Persist the used-words list and the latest post text for manual copy-paste
      - name: Commit generated post
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add used_words.txt latest_post.txt
          git commit -m "Add Spanish word of the day" || echo "No changes to commit"
          git push
